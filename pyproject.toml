[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litmetica3d"
dynamic = ["version"]
description = "Convert Minecraft Litematica schematics to 3D models (STL, OBJ)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "manifold3d>=3.5,<3.6",
    "Pillow>=10",
    "PySide6>=6.8,<6.9",
]
authors = [
    {name = "b站@ZZHaccount"},
]
keywords = ["minecraft", "litematica", "3d", "stl", "obj", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
litmetica3d = "litmetica3d.cli:main"
litmetica3d-gui = "litmetica3d.desktop:launch_gui"

[tool.setuptools.packages.find]
include = ["litmetica3d*"]

[tool.setuptools.dynamic]
version = {attr = "litmetica3d.__version__"}

[tool.setuptools.package-data]
litmetica3d = [
    "mc_assets/26.2/**/*.json",
    "mc_assets/26.2/**/*.png",
    "mc_assets/26.2/**/*.mcmeta",
]
